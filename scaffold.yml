version: 2

# Scaffold CLI Configuration
project:
  # Your Rust/Soroban contract source.
  contracts-dir: contracts

  # Generated TypeScript packages to communicate with your contracts
  # imported as `@stellar-scaffold/app-lib/clients`:
  #   - app-lib/clients/<name>/   one generated binding package per contract
  #   - app-lib/clients/index.ts  instantiates and exports every client
  #
  # To customize a client, import it into your own code under app/ instead of
  # editing the generated file. Everything here is gitignored except .gitkeep.
  clients-dir: app-lib/clients
  package-manager: npm@11.19.1

# Stellar Networks used by your app. Pick one with `--network <name>` or
# STELLAR_NETWORK; the default is `local`. Built-in names (local, testnet,
# futurenet, mainnet) get their RPC URL and passphrase from stellar-cli.
networks:
  # Using the Stellar-Quickstart Docker container
  local:
    # Created and funded on first build, the first account will sign deploys
    accounts: [me]

  # Testnet is staging: a dry run for mainnet. Deploy there deliberately, then
  # point contracts at those deployments below. Public networks never deploy
  # from `build` or `watch` unless you opt in with `allow-deploy: true`.
  testnet:
    # Funded with Friendbot on first build. Keep testnet keys separate from
    # local ones, as you would for mainnet.
    accounts: [testnet-user]

  # To redeploy freely on testnet while developing, add a separate network
  # that opts in, and build for it with STELLAR_NETWORK=testnet-dev:
  # testnet-dev:
  #   extends: testnet
  #   allow-deploy: true

  # mainnet:
  #   # stellar-cli has no default mainnet RPC; bring your own
  #   rpc-url: https://your-rpc-provider.example
  #   rpc-headers:
  #     Authorization: "Bearer ${env.MAINNET_RPC_TOKEN}"
  #   accounts: [mainnet-user]

# Contracts to build, deploy, and generate clients for.
# The web app talks to any RentalDeposit instance by id (?id=C... in the URL),
# so this entry is only the default instance plus the source of the network
# config the frontend reads.
contracts:
  rental-deposit:
    networks:
      testnet:
        type: contract
        source: CAUS4P47QJ4Y6L4NSAB45PUFOWLAFNMNHUGW6G2UCRTD3LCWH2ETWD2R
